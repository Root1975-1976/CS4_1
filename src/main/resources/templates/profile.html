<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
<div th:replace="navbar :: navbar"></div>
<div class="container">
    <div class="form-card">
        <h2>My Profile</h2>
        <form th:action="@{/update-profile}"
              th:object="${user}"
              method="post">

            <input type="text"
                   th:field="*{name}"
                   placeholder="Name"
                   required>

            <input type="email"
                   th:field="*{email}"
                   placeholder="Email"
                   required>

            <input type="password"
                   th:field="*{password}"
                   placeholder="Password"
                   required>

            <button type="submit">
                Update Profile
            </button>
        </form>
    </div>
</div>
</body>
</html>
